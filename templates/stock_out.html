{% extends "base.html" %}

{% block title %}Stock Out - invenzu{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1>Stock Out</h1>
    <p>Remove stock from product.</p>
  </div>
</div>

<div class="card" style="max-width: 600px; margin: 0 auto; padding: 32px;">
  <form method="POST" action="{{ url_for('stock_out') }}">
    <div class="form-group">
      <label class="form-label">Product</label>
      <select name="product_id" class="form-control" required>
        <option value="">Select product</option>
        {% for p in products %}
        <option value="{{ p.id }}">{{ p.name }} (Available: {{ p.quantity }})</option>
        {% endfor %}
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">Quantity</label>
      <input type="number" name="quantity" class="form-control" placeholder="Enter quantity" min="1" required>
    </div>

    <div class="form-group">
      <label class="form-label">Reason</label>
      <input type="text" name="reason" class="form-control" placeholder="e.g. Sale / Damaged" value="Sale / Damaged" required>
    </div>

    

    <div style="margin-top: 28px;">
      <div style="margin-top: 28px;">
  <button
    type="submit"
    class="btn btn-primary"
    style="width: 100%; padding: 12px; font-size: 0.95rem;"
  >
    Remove Stock
  </button>
</div>
    </div>
  </form>
</div>
{% endblock %}
