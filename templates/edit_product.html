{% extends "base.html" %}

{% block title %}Edit Product - invenzu{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1>Edit Product</h1>
    <p>Update the product details.</p>
  </div>
</div>

<div class="card" style="max-width: 640px; margin: 0 auto; padding: 32px;">
  <form method="POST" action="{{ url_for('edit_product', id=product.id) }}">
    <div class="form-group">
      <label class="form-label">Product Name</label>
      <input type="text" name="name" value="{{ product.name }}" class="form-control" required>
    </div>

    <div class="form-group">
      <label class="form-label">Category</label>
      <select name="category" class="form-control" required>
        <option value="Electronics" {% if product.category == 'Electronics' %}selected{% endif %}>Electronics</option>
        <option value="Furniture" {% if product.category == 'Furniture' %}selected{% endif %}>Furniture</option>
        <option value="Stationery" {% if product.category == 'Stationery' %}selected{% endif %}>Stationery</option>
        <option value="Hardware" {% if product.category == 'Hardware' %}selected{% endif %}>Hardware</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">Brand</label>
      <input type="text" name="brand" value="{{ product.brand }}" class="form-control" required>
    </div>

    <div class="form-group">
      <label class="form-label">Quantity</label>
      <input type="number" name="quantity" value="{{ product.quantity }}" class="form-control" min="0" required>
    </div>

    <div class="form-group">
      <label class="form-label">Price (₹)</label>
      <input type="number" step="0.01" name="price" value="{{ product.price }}" class="form-control" min="0" required>
    </div>

    <div class="form-group">
      <label class="form-label">Supplier</label>
      <select name="supplier_id" class="form-control" required>
        {% for s in suppliers %}
        <option value="{{ s.id }}" {% if product.supplier_id == s.id %}selected{% endif %}>{{ s.name }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">Status</label>
      <select name="status" class="form-control">
        <option value="In Stock" {% if product.status == 'In Stock' %}selected{% endif %}>In Stock</option>
        <option value="Low Stock" {% if product.status == 'Low Stock' %}selected{% endif %}>Low Stock</option>
        <option value="Out of Stock" {% if product.status == 'Out of Stock' %}selected{% endif %}>Out of Stock</option>
      </select>
    </div>

    <div style="display: flex; gap: 14px; margin-top: 28px;">
      <button type="submit" class="btn btn-primary" style="flex: 1; padding: 12px;">Update Product</button>
      <a href="{{ url_for('products') }}" class="btn btn-outline" style="min-width: 120px;">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
