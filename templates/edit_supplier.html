{% extends "base.html" %}

{% block title %}Edit Supplier - invenzu{% endblock %}

{% block content %}

<div class="page-header">
  <div>
    <h1>Edit Supplier</h1>
    <p>Update supplier details.</p>
  </div>
</div>

<div
  class="card"
  style="max-width: 600px; margin: 0 auto; padding: 32px;"
>

  <form
    method="POST"
    action="{{ url_for('edit_supplier', id=supplier.id) }}"
  >

    <div class="form-group">
      <label class="form-label">
        Supplier Name
      </label>

      <input
        type="text"
        name="name"
        class="form-control"
        value="{{ supplier.name }}"
        placeholder="Enter supplier name"
        required
      >
    </div>


    <div class="form-group">
      <label class="form-label">
        Phone Number
      </label>

      <input
        type="text"
        name="phone"
        class="form-control"
        value="{{ supplier.phone }}"
        placeholder="Enter phone number"
        required
      >
    </div>


    <div class="form-group">
      <label class="form-label">
        Email
      </label>

      <input
        type="email"
        name="email"
        class="form-control"
        value="{{ supplier.email }}"
        placeholder="Enter email"
        required
      >
    </div>


    <div class="form-group">
      <label class="form-label">
        Address
      </label>

      <input
        type="text"
        name="address"
        class="form-control"
        value="{{ supplier.address }}"
        placeholder="Enter address"
        required
      >
    </div>


    <div
      style="
        display: flex;
        gap: 14px;
        margin-top: 28px;
      "
    >

      <button
        type="submit"
        class="btn btn-primary"
        style="flex: 1; padding: 12px;"
      >
        Update Supplier
      </button>

      <a
        href="{{ url_for('suppliers') }}"
        class="btn btn-outline"
        style="min-width: 120px; text-align: center;"
      >
        Cancel
      </a>

    </div>

  </form>

</div>

{% endblock %}
