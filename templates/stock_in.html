{% extends "base.html" %}

{% block title %}Stock In - invenzu{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1>Stock In</h1>
    <p>Add stock to an existing product.</p>
  </div>
</div>

<div class="card" style="max-width: 600px; margin: 0 auto; padding: 32px;">
  <form method="POST" action="{{ url_for('stock_in') }}">
    <div class="form-group">
      <label class="form-label">Product</label>
      <select name="product_id" class="form-control" required>
        <option value="">Select product</option>
        {% for p in products %}
        <option value="{{ p.id }}">{{ p.name }} (Current: {{ p.quantity }})</option>
        {% endfor %}
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">Quantity</label>
      <input type="number" name="quantity" class="form-control" placeholder="Enter quantity" min="1" required>
    </div>

    <div class="form-group">
      <label class="form-label">Reason</label>
      <input type="text" name="reason" class="form-control" placeholder="e.g. New Purchase" value="New Purchase" required>
    </div>

  

    <div style="margin-top: 28px;">
      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 0.95rem;">
        Add Stock
      </button>
    </div>
  </form>
</div>
{% endblock %}
